name: Synapse
options:
  bundleIdPrefix: com.athenesoftworks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Synapse:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Resources
    dependencies:
      - target: synapse-cli
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athenesoftworks.synapse
        PRODUCT_NAME: Synapse
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  synapse-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_NAME: synapse-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.athenesoftworks.synapse.cli
